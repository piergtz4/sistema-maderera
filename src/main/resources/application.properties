spring.application.name=sistema-maderera
debug=false
spring.profiles.default=local
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/maderpro_dev?useSSL=false&serverTimezone=America/Lima&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.flyway.clean-disabled=true
spring.servlet.multipart.max-file-size=3MB
spring.servlet.multipart.max-request-size=4MB
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
maderpro.demo.enabled=${MADERPRO_DEMO_ENABLED:false}
maderpro.demo.password=${MADERPRO_DEMO_PASSWORD:}
