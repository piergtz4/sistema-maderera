<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MADERPRO | Empresas</title>
    <link rel="stylesheet" th:href="@{/css/plataforma.css}">
</head>
<body>
    <header class="encabezado">
        <div class="barra">
            <div class="marca">
                <img th:src="@{/img/LogoPro.png}" alt="Logo MADERPRO">
                <div>
                    <strong>MADER<span>PRO</span></strong>
                    <p>Administración de plataforma</p>
                </div>
            </div>

            <div class="cuenta">
                <span th:text="${nombreAdministrador}">Administrador</span>
                <form th:action="@{/plataforma/logout}" method="post">
                    <button type="submit">Cerrar sesión</button>
                </form>
            </div>
        </div>
    </header>

    <main class="contenido">
        <p th:if="${mensaje}" th:text="${mensaje}" class="aviso exito" role="status"></p>
        <section class="tarjeta">
            <div class="titulo">
                <h1>Empresas</h1>
                <div class="acciones">
                    <span>
                        Total:
                        <strong th:text="${#lists.size(empresas)}">0</strong>
                    </span>
                    <a class="boton principal" th:href="@{/plataforma/empresas/nueva}">Registrar empresa</a>
                </div>
            </div>

            <div class="tabla-contenedor">
                <table aria-label="Empresas registradas">
                    <thead>
                        <tr>
                            <th scope="col">Empresa</th>
                            <th scope="col">RUC</th>
                            <th scope="col">Correo</th>
                            <th scope="col">Teléfono</th>
                            <th scope="col">Estado</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="empresa : ${empresas}">
                            <td>
                                <strong th:text="${empresa.nombreComercial}">
                                    Nombre comercial
                                </strong>
                            </td>
                            <td th:text="${#strings.isEmpty(empresa.ruc) ? '—' : empresa.ruc}"></td>
                            <td th:text="${#strings.isEmpty(empresa.email) ? '—' : empresa.email}"></td>
                            <td th:text="${#strings.isEmpty(empresa.telefono) ? '—' : empresa.telefono}"></td>
                            <td>
                                <span class="estado"
                                      th:classappend="${empresa.estado ? 'activa' : 'inactiva'}"
                                      th:text="${empresa.estado ? 'Activa' : 'Inactiva'}">
                                    Activa
                                </span>
                            </td>
                        </tr>

                        <tr th:if="${#lists.isEmpty(empresas)}">
                            <td colspan="5" class="vacio">
                                No hay empresas registradas.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>
</body>
</html>
