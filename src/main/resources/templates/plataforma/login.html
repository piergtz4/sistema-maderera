<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MADERPRO | Administración de plataforma</title>
    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>
<body>
    <main class="login-page">
        <section class="brand-panel">
            <div class="brand-overlay"></div>

            <div class="brand-content">
                <div class="brand-logo">
                    <img th:src="@{/img/LogoPro.png}" alt="Logo MADERPRO">
                </div>

                <h1 class="brand-name">MADER<span>PRO</span></h1>
                <p class="brand-subtitle">Administración de plataforma</p>
                <div class="brand-divider"></div>
            </div>
        </section>

        <section class="login-panel">
            <div class="login-content">
                <header class="login-header">
                    <h2>Iniciar sesión</h2>
                    <p>Acceso para administradores de la plataforma.</p>
                </header>

                <form class="login-form"
                      th:action="@{/plataforma/login}"
                      method="post">

                    <div class="form-group" th:if="${param.error}">
                        <p class="login-message" role="alert">
                            El usuario o la contraseña son incorrectos.
                        </p>
                    </div>

                    <div class="form-group" th:if="${param.logout}">
                        <p class="login-message success" role="status">
                            La sesión se cerró correctamente.
                        </p>
                    </div>

                    <div class="form-group">
                        <label for="usuario">Usuario</label>
                        <div class="input-wrapper">
                            <input type="text" id="usuario" name="usuario"
                                   autocomplete="username" maxlength="50"
                                   spellcheck="false" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="password">Contraseña</label>
                        <div class="input-wrapper">
                            <input type="password" id="password" name="password"
                                   autocomplete="current-password" required>
                        </div>
                    </div>

                    <button type="submit" class="login-button">
                        Iniciar sesión
                    </button>
                </form>
            </div>
        </section>
    </main>
</body>
</html>
