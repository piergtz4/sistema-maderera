name: Revisión SAST

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sast:
    runs-on: ubuntu-24.04

    steps:
      - name: Obtener el código
        uses: actions/checkout@v7

      - name: Preparar Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Instalar Semgrep
        run: python -m pip install semgrep==1.187.0

      - name: Analizar el código con Semgrep
        run: |
          mkdir -p reportes
          semgrep scan --config p/java --metrics off --disable-version-check --error --strict --json-output reportes/sast.json src/main/java

      - name: Conservar el reporte
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reporte-sast
          path: reportes/sast.json
          if-no-files-found: error